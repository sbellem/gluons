name: Test Channel

on:
  push:
    branches: [main, ci]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Guix
        uses: sbellem/guix-install-action@dev
        with:
          version: "1.5.0"
          pullAfterInstall: false

      - name: Pull Guix (rust-team branch)
        run: guix pull --disable-authentication --channels=channels.scm

      - name: Test channel loads
        run: guix time-machine --disable-authentication --channels=channels.scm -- describe

      - name: Dry-run build rust-1.91
        run: guix time-machine --disable-authentication --channels=channels.scm -- build -e '(@ (rust) rust-1.91)' --dry-run

      - name: Dry-run build rust-1.92
        run: guix time-machine --disable-authentication --channels=channels.scm -- build -e '(@ (rust) rust-1.92)' --dry-run

      - name: Dry-run build rust-1.93
        run: guix time-machine --disable-authentication --channels=channels.scm -- build -e '(@ (rust) rust-1.93)' --dry-run
